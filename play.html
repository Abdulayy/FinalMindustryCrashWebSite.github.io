<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="css/style.css">

<canvas id="bg" aria-hidden="true"></canvas>

<div class="grow">
<section class="more-intro">
  <h1>More</h1>
  <p>Official information and useful resources for the game.</p>
  <div class="row more-actions">
    <a class="btn main" href="https://anuke.itch.io/mindustry" target="_blank" rel="noopener noreferrer">Official link</a>

    <span class="preview-mark">M</span>
